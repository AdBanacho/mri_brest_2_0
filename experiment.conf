# Experiment configuration -- trusted Bash, sourced by run_experiment.slurm (Bash 4.3+).
# Duke 3D: grid and hyper-parameters of the reference mri_brest experiment.conf, but cohort
# profile general (phases ordered by parsed DCE phase, see docs/data-and-tabular.md 3.1-3.2);
# set TRAIN[profile]=duke_legacy_3d [phase_order]=metadata [phase_count]=5 to reproduce legacy
# numbers. Field names, types and allowed values come from
# src/mribreast/config/fields.tsv (`python -m mribreast fields` lists them).
# Relative paths resolve against THIS file's directory before submission.
# Usage and semantics: docs/slurm.md.

PYTHON_BIN=python3
PYTHON_VENV_ROOT=/net/scratch/hscra/plgrid/plgabanacho/mri_brest_2_0/.venvs  # managed envs: <root>/<uname -m>/runtime-<hash>/ (created on compute nodes; scratch: home quota is 10 GB)
AUTO_INSTALL_PYTHON_PACKAGES=true  # false: use PYTHON_VENV_ROOT as a prepared env (or '' = PYTHON_BIN as is)
# Dependencies of pyproject.toml except numpy/torch, which come from MODULES and
# are passed to pip as constraints. The package itself runs from src/ (PYTHONPATH).
PYTHON_PACKAGES=(
  'pandas>=2.0,<2.3' 'scipy>=1.10' 'scikit-learn>=1.3,<1.8' 'xgboost>=2.0,<4'
  monai==1.5.1 pytorch-lightning==2.5.6 torchmetrics==1.8.2
  'nibabel>=5.0' 'openpyxl>=3.1' 'joblib>=1.3' 'matplotlib>=3.7' 'pillow>=10.0'
  'tifffile>=2023.1' 'filelock>=3.12'
)
MODULES=(ML-bundle)  # loaded only inside compute jobs (PYTHONNOUSERSITE=1 before and after)
MAX_JOBS=0           # 0 = full training grid; otherwise the first N training rows
MAX_CONCURRENT=4     # Slurm array throttle for prepare/train/validate arrays
CLEAN_BEFORE_TRAIN=false     # true deletes checkpoint_root + logs_root before submission (safety-checked)
CLEAN_BEFORE_VALIDATE=false  # true deletes validation_root (+ summary_root) before submission

# Inputs: data/duke/ (git-ignored) holds symlinks to the Duke workbooks in the reference
# checkout (~/mri_brest/mriBreastDuke/features/) and data/duke/nifti -> the Helios NIfTI
# store /net/storage/pr3/plgrid/plggsiwomipipan/aBanacho_duke_oncotype/tciaNifti.
# Large outputs (prepared caches ~20 GB, checkpoints) go to scratch: the home quota is 10 GB. Scratch is purged periodically -- copy results you keep.
declare -A PATHS=(
  [clinical_features_file]=data/duke/Clinical_and_Other_Features.xlsx
  [metadata_file]=data/duke/Duke-Breast-Cancer-MRI_v2_20220609-nbia-digest.xlsx
  [imaging_features_file]=data/duke/Imaging_Features.xlsx
  [annotation_boxes_file]=data/duke/Annotation_Boxes.xlsx
  [density_file]=''                 # data/duke/Breast_Radiologist_Density_Assessments.xlsx to enable feature group density (covers 18/261 studies)
  [mricore_features_file]=''        # data/duke/mricore/mricore_embeddings.csv (sbatch run_mricore_embed.slurm) to enable feature group mricore
  [allowed_predictors_file]=''      # '' = packaged allowed-predictor policy
  [image_root]=data/duke/nifti  # <SeriesInstanceUID>.nii.gz, all 1303 cohort series present
  [image_manifest_file]=''
  [mask_manifest_file]=''
  [prepared_root]=/net/scratch/hscra/plgrid/plgabanacho/mri_brest_2_0/duke/prepared
  [subtraction_root]=/net/scratch/hscra/plgrid/plgabanacho/mri_brest_2_0/duke/prepared_subtraction
  [logs_root]=/net/scratch/hscra/plgrid/plgabanacho/mri_brest_2_0/duke/lightning_logs
  [checkpoint_root]=/net/scratch/hscra/plgrid/plgabanacho/mri_brest_2_0/duke/checkpoints
  [validation_root]=runs/duke/validation
  [summary_root]=runs/duke/validation/summary
  [slurm_logs]=/net/scratch/hscra/plgrid/plgabanacho/mri_brest_2_0/duke/slurm  # Slurm logs + frozen run snapshots
)

# Resource settings become sbatch arguments (Slurm does not expand variables in #SBATCH).
declare -A JOB_TRAIN=(
  [job_name]=mri_train [cpus]=16 [gpus]=1 [memory]=48G [time]=24:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
declare -A JOB_VALIDATE=(
  [job_name]=mri_validate [cpus]=16 [gpus]=1 [memory]=48G [time]=24:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
declare -A JOB_SUMMARIZE=(
  [job_name]=mri_summarize [cpus]=2 [gpus]=0 [memory]=8G [time]=02:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
# Optional prepare stage; when omitted it copies JOB_TRAIN (job name mri_prepare).
declare -A JOB_PREPARE=(
  [job_name]=mri_prepare [cpus]=16 [gpus]=0 [memory]=48G [time]=12:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
EXTRA_SBATCH_TRAIN=()     # only --qos= --constraint= --reservation= --nice= --mail-type= --mail-user=
EXTRA_SBATCH_VALIDATE=()
EXTRA_SBATCH_SUMMARIZE=()
EXTRA_SBATCH_PREPARE=()

# Fixed training values (train section of fields.tsv). Unset keys take the
# fields.tsv default. Booleans are true/false; target_size is 'D H W' words.
declare -A TRAIN=(
  # general + explicit: series ordered by parsed DCE phase (pre, post1, ..). duke_legacy_3d keeps metadata row
  # order, which on the real digest puts the non-DCE "ax t1" series into 220/261 studies. phase_count=4
  # (pre + 3 posts) keeps 257/261 studies; 5 keeps 111 (most Duke studies have 3 posts).
  [profile]=general [phase_order]=explicit [phase_count]=4
  [seed]=42 [target_size]='256 256 64'
  [epoch]=30 [num_folds]=5 [threshold_calibration_folds]=5 [num_workers]=4
  [feature_selector]=lasso [imaging_patient_id_column]='Patient ID'
  [allow_missing_imaging_features]=false [include_sensitive]=false
  [use_annotation_boxes]=true   # the legacy CLI default is false; this Slurm profile enables it
  [lasso_cv_folds]=5 [lasso_cs]=20 [lasso_max_iter]=5000
  [lasso_tolerance]=1e-4 [lasso_min_features]=1 [lasso_n_jobs]=8 [lasso_plot_top_n]=30
  [xgb_n_estimators]=300 [xgb_max_depth]=3 [xgb_learning_rate]=0.03
  [xgb_subsample]=0.8 [xgb_colsample_bytree]=0.8 [xgb_n_jobs]=8
  [mlp_hidden_layers]='128,64' [mlp_alpha]=1e-4
  [mlp_learning_rate]=1e-3 [mlp_max_iter]=500
  # JSON objects passed unchanged; Python validates them on the compute node.
  [xgb_extra_json]='{}' [mlp_extra_json]='{}'
  [mri_extra_json]='{}' [trainer_extra_json]='{}'
)

# Grid: | separates choices, commas stay inside a choice (csv keys), spaces stay
# inside a choice (target_size, multi-word strings). Keys are sorted; the last
# sorted key varies fastest. A key is either fixed (TRAIN) or an axis, not both.
# This grid has 3 x 2 x 2 x 2 = 24 training rows.
declare -A TRAIN_GRID=(
  [mri_model]='densenet121|resnet10|resnet18'
  [subtraction_mode]=none
  [feature_groups]='clinical|clinical,kinetic,morphology,heterogeneity'
  [feature_model]='xgboost|mlp'
  [batch_size]=4 [positive_boost]=1.0 [sensitivity_lambda]='0.05|0.2' [lr]=1e-4
)

# Validation reuses each training row; VALIDATE[num_workers] is the legacy alias
# of validate_num_workers. Tasks = training rows x VALIDATE_GRID size (24 here).
declare -A VALIDATE=( [num_workers]=4 )
declare -A VALIDATE_GRID=( [fusion_alpha]=0.5 )  # e.g. '0.25|0.5|0.75' -> 72 validation tasks
declare -A SUMMARIZE=( [expected_folds]=5 [top_n]=20 [include_incomplete]=false )
