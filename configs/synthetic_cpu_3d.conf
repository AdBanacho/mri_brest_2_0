# Local CPU acceptance run: 3D image + tabular + late fusion on synthetic data.
# Data (once):  python -m mribreast make-synthetic --out runs/synthetic/data
# Run:          bash run_experiment.sh --local --train     --config configs/synthetic_cpu_3d.conf
#               bash run_experiment.sh --local --validate  --config configs/synthetic_cpu_3d.conf
#               bash run_experiment.sh --local --summarize --config configs/synthetic_cpu_3d.conf
# Relative paths resolve against configs/, so ../runs is <repo>/runs (git-ignored).
PYTHON_BIN=python
PYTHON_VENV_ROOT=''
AUTO_INSTALL_PYTHON_PACKAGES=false
PYTHON_PACKAGES=()
MODULES=()
MAX_JOBS=0
MAX_CONCURRENT=1
CLEAN_BEFORE_TRAIN=false
CLEAN_BEFORE_VALIDATE=false

declare -A PATHS=(
  [clinical_features_file]=../runs/synthetic/data/Clinical_and_Other_Features.xlsx
  [metadata_file]=../runs/synthetic/data/nbia_metadata.xlsx
  [imaging_features_file]=../runs/synthetic/data/Imaging_Features.xlsx
  [annotation_boxes_file]=../runs/synthetic/data/Annotation_Boxes.xlsx
  [density_file]=../runs/synthetic/data/Breast_Radiologist_Density_Assessments.xlsx
  [allowed_predictors_file]=''
  [image_root]=../runs/synthetic/data/nifti
  [image_manifest_file]=''
  [mask_manifest_file]=''
  [prepared_root]=../runs/synthetic/3d/prepared
  [subtraction_root]=../runs/synthetic/3d/prepared_subtraction
  [logs_root]=../runs/synthetic/3d/lightning_logs
  [checkpoint_root]=../runs/synthetic/3d/checkpoints
  [validation_root]=../runs/synthetic/3d/validation
  [summary_root]=../runs/synthetic/3d/validation/summary
  [slurm_logs]=../runs/synthetic/3d/runs
)
# Resources are validated but unused by --local.
declare -A JOB_TRAIN=( [job_name]=syn3d_train [cpus]=2 [gpus]=0 [memory]=4G [time]=01:00:00 )
declare -A JOB_VALIDATE=( [job_name]=syn3d_validate [cpus]=2 [gpus]=0 [memory]=4G [time]=01:00:00 )
declare -A JOB_SUMMARIZE=( [job_name]=syn3d_summarize [cpus]=1 [gpus]=0 [memory]=2G [time]=00:30:00 )

declare -A TRAIN=(
  [profile]=duke_legacy_3d [branches]=image,tabular
  [seed]=42 [target_size]='32 32 16' [epoch]=2 [num_folds]=3 [threshold_calibration_folds]=2
  [num_workers]=0 [batch_size]=2 [lr]=1e-3 [positive_boost]=1.0 [sensitivity_lambda]=0.05
  [mri_model]=resnet10 [subtraction_mode]=none [use_annotation_boxes]=true
  [feature_groups]=clinical,kinetic,morphology,heterogeneity [feature_selector]=lasso
  [imaging_patient_id_column]='Patient ID'
  [lasso_cv_folds]=2 [lasso_cs]=5 [lasso_max_iter]=2000 [lasso_n_jobs]=1 [lasso_plot_top_n]=10
  [xgb_n_estimators]=20 [xgb_max_depth]=2 [xgb_n_jobs]=1
  [mlp_hidden_layers]=16 [mlp_max_iter]=100
)
# 2 training rows.
declare -A TRAIN_GRID=( [feature_model]='xgboost|mlp' )
declare -A VALIDATE=( [validate_num_workers]=0 )
# alpha 0 = tabular only, 1 = image only: 2 x 3 = 6 validation tasks.
declare -A VALIDATE_GRID=( [fusion_alpha]='0|0.5|1' )
declare -A SUMMARIZE=( [expected_folds]=3 [top_n]=10 [include_incomplete]=false )
