# Duke 2D + external masks (profile general). Trusted Bash, sourced by run_experiment.slurm.
#   bash run_experiment.sh --show-config --config configs/duke_2d_mask.conf
# Relative paths resolve against THIS directory (configs/), hence ../data and ../runs.
# 2D slices are cut from the Duke NIfTI phases (image_source=nifti) at the slice with
# the largest ROI area of the external mask; masks must also exist at inference.
# For ready 2D PNG/TIFF images set TRAIN[image_source]=manifest_2d,
# TRAIN[slice_selection]=center and PATHS[image_manifest_file].

PYTHON_BIN=python3
PYTHON_VENV_ROOT=../.venvs
AUTO_INSTALL_PYTHON_PACKAGES=true
PYTHON_PACKAGES=(
  'pandas>=2.0,<2.3' 'scipy>=1.10' 'scikit-learn>=1.3,<1.8' 'xgboost>=2.0,<4'
  monai==1.5.1 pytorch-lightning==2.5.6 torchmetrics==1.8.2
  'nibabel>=5.0' 'openpyxl>=3.1' 'joblib>=1.3' 'matplotlib>=3.7' 'pillow>=10.0'
  'tifffile>=2023.1' 'filelock>=3.12'
)
MODULES=(ML-bundle)
MAX_JOBS=0
MAX_CONCURRENT=4
CLEAN_BEFORE_TRAIN=false
CLEAN_BEFORE_VALIDATE=false

declare -A PATHS=(
  [clinical_features_file]=../data/duke/Clinical_and_Other_Features.xlsx
  [metadata_file]=../data/duke/Duke-Breast-Cancer-MRI_v2_20220609-nbia-digest.xlsx
  [imaging_features_file]=../data/duke/Imaging_Features.xlsx
  [annotation_boxes_file]=../data/duke/Annotation_Boxes.xlsx
  [density_file]=''  # ../data/duke/Breast_Radiologist_Density_Assessments.xlsx for feature group density
  [allowed_predictors_file]=''
  [image_root]=../data/duke/nifti
  [image_manifest_file]=''
  # TODO: no Duke lesion masks exist yet; create them and their manifest before running this config.
  [mask_manifest_file]=../data/duke/masks/manifest.csv
  [prepared_root]=/net/scratch/hscra/plgrid/plgabanacho/mri_brest_2_0/duke2d/prepared
  [subtraction_root]=/net/scratch/hscra/plgrid/plgabanacho/mri_brest_2_0/duke2d/prepared_subtraction
  [logs_root]=../runs/duke2d/lightning_logs
  [checkpoint_root]=/net/scratch/hscra/plgrid/plgabanacho/mri_brest_2_0/duke2d/checkpoints
  [validation_root]=../runs/duke2d/validation
  [summary_root]=../runs/duke2d/validation/summary
  [slurm_logs]=../runs/duke2d/slurm
)

declare -A JOB_TRAIN=(
  [job_name]=mri2d_train [cpus]=16 [gpus]=1 [memory]=48G [time]=24:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
declare -A JOB_VALIDATE=(
  [job_name]=mri2d_validate [cpus]=16 [gpus]=1 [memory]=48G [time]=24:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
declare -A JOB_SUMMARIZE=(
  [job_name]=mri2d_summarize [cpus]=2 [gpus]=0 [memory]=8G [time]=02:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
EXTRA_SBATCH_TRAIN=()
EXTRA_SBATCH_VALIDATE=()
EXTRA_SBATCH_SUMMARIZE=()

declare -A TRAIN=(
  [profile]=general [label_scheme]=oncotype_binary_18 [phase_order]=explicit
  [image_dim]=2d [image_source]=nifti [target_size_2d]='224 224' [slice_axis]=2
  [slice_selection]=mask_max_area [aggregation]=mean_prob
  [mask_provider]=local_files [mask_kind]=manual [mask_mode]=roi_crop [mask_roi_classes]=1
  [roi_margin]=0.1 [mask_missing_policy]=error [mask_empty_policy]=full_image
  [mask_provenance]=unknown
  [selection_split]=separate [selector_preprocessing]=fold_local [mlp_early_stopping]=grouped
  [seed]=42 [epoch]=30 [num_folds]=5 [threshold_calibration_folds]=5 [num_workers]=4
  [batch_size]=16 [lr]=1e-4 [positive_boost]=1.0 [sensitivity_lambda]=0.05
  [feature_selector]=lasso [imaging_patient_id_column]='Patient ID'
  [lasso_n_jobs]=8 [xgb_n_jobs]=8
)
# 2 x 2 = 4 training rows.
declare -A TRAIN_GRID=(
  [mri_model]=resnet18
  [feature_groups]='clinical|clinical,kinetic,morphology,heterogeneity'
  [feature_model]='xgboost|mlp'
)
declare -A VALIDATE=( [validate_num_workers]=4 [primary_branch]=fusion )
declare -A VALIDATE_GRID=( [fusion_alpha]='0.25|0.5|0.75' )
declare -A SUMMARIZE=( [expected_folds]=5 [top_n]=20 [include_incomplete]=false )
