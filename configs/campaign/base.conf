# Screening campaign: shared base (baseline B0). Sourced by every configs/campaign/*.conf run file;
# not a run itself. Design and run list: configs/campaign/README.md. Submit all: configs/campaign/submit.sh
#
# All runs share checkpoint/validation roots: train_id/eval_id hash every setting, so different runs never
# collide and one `--summarize` ranks the whole campaign. No two run files define the same row.
# Relative paths resolve against configs/campaign/ (the run file's directory).

SCRATCH=/net/scratch/hscra/plgrid/plgabanacho/mri_brest_2_0

PYTHON_BIN=python3
PYTHON_VENV_ROOT=$SCRATCH/.venvs
AUTO_INSTALL_PYTHON_PACKAGES=true
PYTHON_PACKAGES=(
  'pandas>=2.0,<2.3' 'scipy>=1.10' 'scikit-learn>=1.3,<1.8' 'xgboost>=2.0,<4'
  monai==1.5.1 pytorch-lightning==2.5.6 torchmetrics==1.8.2
  'nibabel>=5.0' 'openpyxl>=3.1' 'joblib>=1.3' 'matplotlib>=3.7' 'pillow>=10.0'
  'tifffile>=2023.1' 'filelock>=3.12'
)
MODULES=(ML-bundle)
MAX_JOBS=0
MAX_CONCURRENT=4
CLEAN_BEFORE_TRAIN=false      # never true in a campaign: other runs write to the same roots
CLEAN_BEFORE_VALIDATE=false

declare -A PATHS=(
  [clinical_features_file]=../../data/duke/Clinical_and_Other_Features.xlsx
  [metadata_file]=../../data/duke/Duke-Breast-Cancer-MRI_v2_20220609-nbia-digest.xlsx
  [imaging_features_file]=../../data/duke/Imaging_Features.xlsx
  [annotation_boxes_file]=../../data/duke/Annotation_Boxes.xlsx
  [density_file]=''
  [mricore_features_file]=''       # set by the run files that use feature group mricore
  [allowed_predictors_file]=''
  [image_root]=../../data/duke/nifti
  [image_manifest_file]=''
  [mask_manifest_file]=''          # set by the 2D MRI-CORE mask runs
  # Image caches are content-keyed and locked: shared with experiment.conf so nothing is prepared twice.
  [prepared_root]=$SCRATCH/duke/prepared
  [subtraction_root]=$SCRATCH/duke/prepared_subtraction
  [logs_root]=$SCRATCH/campaign/lightning_logs
  [checkpoint_root]=$SCRATCH/campaign/checkpoints
  [validation_root]=../../runs/campaign/validation   # small, kept in home (scratch is purged)
  [summary_root]=../../runs/campaign/summary
  [slurm_logs]=$SCRATCH/campaign/slurm
)

declare -A JOB_TRAIN=(
  [job_name]=cmp_train [cpus]=16 [gpus]=1 [memory]=48G [time]=24:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
declare -A JOB_VALIDATE=(
  [job_name]=cmp_validate [cpus]=16 [gpus]=1 [memory]=48G [time]=08:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
declare -A JOB_SUMMARIZE=(
  [job_name]=cmp_summarize [cpus]=2 [gpus]=0 [memory]=8G [time]=02:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
declare -A JOB_PREPARE=(
  [job_name]=cmp_prepare [cpus]=16 [gpus]=0 [memory]=48G [time]=12:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
EXTRA_SBATCH_TRAIN=()
EXTRA_SBATCH_VALIDATE=()
EXTRA_SBATCH_SUMMARIZE=()
EXTRA_SBATCH_PREPARE=()

# Baseline B0. Run files override single keys; a key moved to TRAIN_GRID must be unset here first
# (`unset 'TRAIN[key]'`): a key is fixed or an axis, not both.
declare -A TRAIN=(
  [profile]=general [phase_order]=explicit [phase_count]=4 [label_scheme]=oncotype_binary_18
  [branches]=image,tabular [image_dim]=3d [image_source]=nifti [target_size]='256 256 64'
  [mri_model]=densenet121 [subtraction_mode]=none
  [use_annotation_boxes]=true [box_mode]=none
  [loss]=ce_soft_sensitivity [sensitivity_lambda]=0.05 [positive_boost]=1.0
  [optimizer]=adam [scheduler]=none [early_stopping]=false [lr]=1e-4 [batch_size]=4
  [seed]=42 [epoch]=30 [num_folds]=5 [threshold_calibration_folds]=5 [num_workers]=4
  [selection_split]=shared
  [feature_groups]=clinical,kinetic,morphology,heterogeneity [feature_model]=xgboost [feature_selector]=lasso
  [imaging_patient_id_column]='Patient ID' [allow_missing_imaging_features]=false [include_sensitive]=false
  [lasso_cv_folds]=5 [lasso_cs]=20 [lasso_max_iter]=5000 [lasso_tolerance]=1e-4 [lasso_min_features]=1
  [lasso_n_jobs]=8 [lasso_plot_top_n]=30
  [xgb_n_estimators]=300 [xgb_max_depth]=3 [xgb_learning_rate]=0.03
  [xgb_subsample]=0.8 [xgb_colsample_bytree]=0.8 [xgb_n_jobs]=8
  [mlp_hidden_layers]='128,64' [mlp_alpha]=1e-4 [mlp_learning_rate]=1e-3 [mlp_max_iter]=500
  [xgb_extra_json]='{}' [mlp_extra_json]='{}' [mri_extra_json]='{}' [trainer_extra_json]='{}'
)
declare -A TRAIN_GRID=()

# Fusion weight is a validation-only axis: every run is scored at five alphas without retraining
# (alpha 1 = image only, 0 = tabular only).
declare -A VALIDATE=( [validate_num_workers]=4 [threshold_strategy]=balanced_accuracy )
declare -A VALIDATE_GRID=( [fusion_alpha]='0|0.25|0.5|0.75|1' )
declare -A SUMMARIZE=( [expected_folds]=5 [top_n]=30 [include_incomplete]=false )

MRICORE_EMBEDDINGS=../../data/duke/mricore/mricore_embeddings.csv      # run_mricore_embed.slurm default OUTPUT
MRICORE_MASKS=$SCRATCH/segmentation/mri_core_zeroshot/mask_manifest.csv  # segment_mri_core.slurm output
