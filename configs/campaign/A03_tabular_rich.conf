# A3-A8: tabular only, lasso; {imaging, mricore, imaging+mricore} x {xgboost, mlp}
source "$(dirname -- "${BASH_SOURCE[0]}")/base.conf"
TRAIN[branches]=tabular; TRAIN[use_annotation_boxes]=false
declare -A VALIDATE_GRID=( [fusion_alpha]=0.5 )   # no fusion without the image branch
PATHS[mricore_features_file]=$MRICORE_EMBEDDINGS   # needs run_mricore_embed.slurm first
unset 'TRAIN[feature_groups]' 'TRAIN[feature_model]'
TRAIN_GRID[feature_groups]='clinical,kinetic,morphology,heterogeneity|clinical,mricore|clinical,kinetic,morphology,heterogeneity,mricore'
TRAIN_GRID[feature_model]='xgboost|mlp'
