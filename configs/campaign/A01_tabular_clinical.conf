# A1-A2: tabular only, clinical, no selector; xgboost | mlp
source "$(dirname -- "${BASH_SOURCE[0]}")/base.conf"
TRAIN[branches]=tabular; TRAIN[use_annotation_boxes]=false
declare -A VALIDATE_GRID=( [fusion_alpha]=0.5 )   # no fusion without the image branch
TRAIN[feature_groups]=clinical; TRAIN[feature_selector]=none
unset 'TRAIN[feature_model]'; TRAIN_GRID[feature_model]='xgboost|mlp'
