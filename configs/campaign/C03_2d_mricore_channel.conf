# C3: 2D, MRI-CORE masks as a channel on every lesion slice
source "$(dirname -- "${BASH_SOURCE[0]}")/base.conf"
TRAIN[image_dim]=2d; TRAIN[target_size_2d]='224 224'; TRAIN[slice_axis]=2; TRAIN[aggregation]=mean_prob
TRAIN[use_annotation_boxes]=false; TRAIN[batch_size]=16
PATHS[mask_manifest_file]=$MRICORE_MASKS   # needs segment_mri_core.slurm first
TRAIN[mask_provider]=local_files; TRAIN[mask_kind]=predicted; TRAIN[mask_provenance]=frozen_external
TRAIN[mask_roi_classes]=1; TRAIN[roi_margin]=0.1; TRAIN[mask_missing_policy]=drop; TRAIN[mask_empty_policy]=full_image
TRAIN[mask_mode]=mask_channel; TRAIN[slice_selection]=mask_all
