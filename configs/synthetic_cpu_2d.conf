# Local CPU acceptance run: 2D slices + external masks + tabular late fusion.
# Data (once):  python -m mribreast make-synthetic --out runs/synthetic/data
# Run:          bash run_experiment.sh --local --train     --config configs/synthetic_cpu_2d.conf
#               bash run_experiment.sh --local --validate  --config configs/synthetic_cpu_2d.conf
#               bash run_experiment.sh --local --summarize --config configs/synthetic_cpu_2d.conf
# Relative paths resolve against configs/, so ../runs is <repo>/runs (git-ignored).
PYTHON_BIN=python
PYTHON_VENV_ROOT=''
AUTO_INSTALL_PYTHON_PACKAGES=false
PYTHON_PACKAGES=()
MODULES=()
MAX_JOBS=0
MAX_CONCURRENT=1
CLEAN_BEFORE_TRAIN=false
CLEAN_BEFORE_VALIDATE=false

declare -A PATHS=(
  [clinical_features_file]=../runs/synthetic/data/Clinical_and_Other_Features.xlsx
  [metadata_file]=../runs/synthetic/data/nbia_metadata.xlsx
  [imaging_features_file]=../runs/synthetic/data/Imaging_Features.xlsx
  [annotation_boxes_file]=../runs/synthetic/data/Annotation_Boxes.xlsx
  [density_file]=../runs/synthetic/data/Breast_Radiologist_Density_Assessments.xlsx
  [allowed_predictors_file]=''
  [image_root]=../runs/synthetic/data/nifti
  [image_manifest_file]=../runs/synthetic/data/images2d/manifest.csv
  [mask_manifest_file]=../runs/synthetic/data/masks/manifest.csv
  [prepared_root]=../runs/synthetic/2d/prepared
  [subtraction_root]=../runs/synthetic/2d/prepared_subtraction
  [logs_root]=../runs/synthetic/2d/lightning_logs
  [checkpoint_root]=../runs/synthetic/2d/checkpoints
  [validation_root]=../runs/synthetic/2d/validation
  [summary_root]=../runs/synthetic/2d/validation/summary
  [slurm_logs]=../runs/synthetic/2d/runs
)
declare -A JOB_TRAIN=( [job_name]=syn2d_train [cpus]=2 [gpus]=0 [memory]=4G [time]=01:00:00 )
declare -A JOB_VALIDATE=( [job_name]=syn2d_validate [cpus]=2 [gpus]=0 [memory]=4G [time]=01:00:00 )
declare -A JOB_SUMMARIZE=( [job_name]=syn2d_summarize [cpus]=1 [gpus]=0 [memory]=2G [time]=00:30:00 )

# 2D slices cut from the synthetic NIfTI at the largest mask area (image_source=nifti).
# Ready-image variant: [image_source]=manifest_2d [slice_selection]=center.
declare -A TRAIN=(
  [profile]=general [branches]=image,tabular [label_scheme]=oncotype_binary_18
  [image_dim]=2d [image_source]=nifti [target_size_2d]='32 32' [slice_axis]=2
  [slice_selection]=mask_max_area [aggregation]=mean_prob [mri_model]=resnet18
  [mask_provider]=local_files [mask_kind]=manual [mask_roi_classes]=1 [roi_margin]=0.1
  [mask_missing_policy]=full_image [mask_empty_policy]=full_image
  [selection_split]=shared [selector_preprocessing]=fold_local [mlp_early_stopping]=grouped
  [seed]=42 [epoch]=2 [num_folds]=3 [threshold_calibration_folds]=2 [num_workers]=0
  [batch_size]=4 [lr]=1e-3 [positive_boost]=1.0 [sensitivity_lambda]=0.05
  [feature_groups]=clinical,kinetic [feature_model]=xgboost [feature_selector]=lasso
  [imaging_patient_id_column]='Patient ID'
  [lasso_cv_folds]=2 [lasso_cs]=5 [lasso_max_iter]=2000 [lasso_n_jobs]=1 [lasso_plot_top_n]=10
  [xgb_n_estimators]=20 [xgb_max_depth]=2 [xgb_n_jobs]=1
)
# 2 training rows: two ways of using the mask.
declare -A TRAIN_GRID=( [mask_mode]='roi_crop|mask_channel' )
declare -A VALIDATE=( [validate_num_workers]=0 [primary_branch]=fusion )
declare -A VALIDATE_GRID=( [fusion_alpha]='0.5|1' )
declare -A SUMMARIZE=( [expected_folds]=3 [top_n]=10 [include_incomplete]=false )
