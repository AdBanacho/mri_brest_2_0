# Local CPU smoke run: 3D image-only with Duke annotation boxes as input, box_mode=dual_stream
# (global volume + local box crop, two encoders (erasing on the global stream during fit)).
# Boxes are used at training AND inference (research setting: a box must exist for test studies too).
# Data (once):  python -m mribreast make-synthetic --out runs/synthetic/data
# Run:          bash run_experiment.sh --local --train     --config configs/synthetic_cpu_3d_box_dual_stream.conf
#               bash run_experiment.sh --local --validate  --config configs/synthetic_cpu_3d_box_dual_stream.conf
#               bash run_experiment.sh --local --summarize --config configs/synthetic_cpu_3d_box_dual_stream.conf
# tests/e2e/test_modes_smoke.py reads the TRAIN block of this file.
PYTHON_BIN=python
PYTHON_VENV_ROOT=''
AUTO_INSTALL_PYTHON_PACKAGES=false
PYTHON_PACKAGES=()
MODULES=()
MAX_JOBS=0
MAX_CONCURRENT=1
CLEAN_BEFORE_TRAIN=false
CLEAN_BEFORE_VALIDATE=false

declare -A PATHS=(
  [clinical_features_file]=../runs/synthetic/data/Clinical_and_Other_Features.xlsx
  [metadata_file]=../runs/synthetic/data/nbia_metadata.xlsx
  [imaging_features_file]=../runs/synthetic/data/Imaging_Features.xlsx
  [annotation_boxes_file]=../runs/synthetic/data/Annotation_Boxes.xlsx
  [density_file]=../runs/synthetic/data/Breast_Radiologist_Density_Assessments.xlsx
  [allowed_predictors_file]=''
  [image_root]=../runs/synthetic/data/nifti
  [image_manifest_file]=''
  [mask_manifest_file]=''
  [prepared_root]=../runs/synthetic/3d_box_dual_stream/prepared
  [subtraction_root]=../runs/synthetic/3d_box_dual_stream/prepared_subtraction
  [logs_root]=../runs/synthetic/3d_box_dual_stream/lightning_logs
  [checkpoint_root]=../runs/synthetic/3d_box_dual_stream/checkpoints
  [validation_root]=../runs/synthetic/3d_box_dual_stream/validation
  [summary_root]=../runs/synthetic/3d_box_dual_stream/validation/summary
  [slurm_logs]=../runs/synthetic/3d_box_dual_stream/runs
)
# Resources are validated but unused by --local.
declare -A JOB_TRAIN=( [job_name]=syn3d_box_train [cpus]=2 [gpus]=0 [memory]=4G [time]=01:00:00 )
declare -A JOB_VALIDATE=( [job_name]=syn3d_box_validate [cpus]=2 [gpus]=0 [memory]=4G [time]=01:00:00 )
declare -A JOB_SUMMARIZE=( [job_name]=syn3d_box_summarize [cpus]=1 [gpus]=0 [memory]=2G [time]=00:30:00 )

declare -A TRAIN=(
  [profile]=general [branches]=image [feature_selector]=none
  [seed]=42 [target_size]='32 32 16' [epoch]=2 [num_folds]=3 [threshold_calibration_folds]=2
  [num_workers]=0 [batch_size]=2 [lr]=1e-3 [positive_boost]=1.0 [sensitivity_lambda]=0.05
  [mri_model]=resnet10 [subtraction_mode]=none
  [box_mode]=dual_stream [box_margin]=0.25 [box_missing_policy]=full_image [use_annotation_boxes]=true [box_local_size]='16 16 8' [dual_stream_embed_dim]=32
)
# 1 training row.
declare -A TRAIN_GRID=()
declare -A VALIDATE=( [validate_num_workers]=0 [primary_branch]=image )
declare -A VALIDATE_GRID=( [fusion_alpha]='0.5' )
declare -A SUMMARIZE=( [expected_folds]=3 [top_n]=10 [include_incomplete]=false )
