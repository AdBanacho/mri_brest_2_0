[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mribreast"
version = "2.0.0.dev0"
description = "Patient-grouped MRI (3D/2D, masks) + tabular late-fusion pipeline for Oncotype DX risk prediction on the Duke Breast Cancer MRI cohort"
requires-python = ">=3.10"
# Versions verified on the CPU acceptance run (see docs/legacy-parity.md).
# numpy/torch are NOT pinned here: on Helios they come from the ML-bundle module
# and are passed as pip constraints by run_experiment.slurm.
dependencies = [
  "numpy>=1.24,<2.3",
  "pandas>=2.0,<2.3",
  "scipy>=1.10",
  "scikit-learn>=1.3,<1.8",
  "xgboost>=2.0,<4",
  "torch>=2.1",
  "monai==1.5.1",
  "pytorch-lightning==2.5.6",
  "torchmetrics==1.8.2",
  "nibabel>=5.0",
  "openpyxl>=3.1",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "pillow>=10.0",
  "tifffile>=2023.1",
  "filelock>=3.12",
]

[project.optional-dependencies]
# Separate, explicit data-preparation stage (network + DICOM). Never imported by train/validate.
prepare = ["requests>=2.31", "pydicom>=2.4", "SimpleITK>=2.3", "synapseclient>=4.0"]
# Box-prompted lesion segmentation with MRI-CORE/SAM (prepare-data segment-mri-core). Never imported by
# train/validate. torchvision must match the installed torch (on Helios: pip-constrained to ML-bundle's torch).
segment = ["einops>=0.7", "torchvision>=0.16"]
tensorboard = ["tensorboard>=2.14"]
test = ["pytest>=7.4"]

[project.scripts]
mribreast = "mribreast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mribreast = ["config/*.tsv", "config/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "slow: end-to-end runs (minutes on CPU)",
  "parity: compares against the reference repository (needs MRI_BREAST_LEGACY_REPO)",
  "bash: requires bash (Git Bash on Windows)",
]
addopts = "-ra"
